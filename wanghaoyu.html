<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王浩宇帅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 背景星星动画 */
        .stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        .title {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 24px;
            user-select: none;
        }

        .title span {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(180deg, #fff 0%, #ffd700 60%, #ff8c00 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.3);
            animation: float 3s ease-in-out infinite;
            cursor: default;
        }

        .title span:nth-child(1) { animation-delay: 0s; }
        .title span:nth-child(2) { animation-delay: 0.3s; }
        .title span:nth-child(3) { animation-delay: 0.6s; }
        .title span:nth-child(4) { animation-delay: 0.9s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }

        /* 光晕装饰 */
        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15), transparent 70%);
            animation: pulse 4s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        @media (max-width: 768px) {
            .title span {
                font-size: 64px;
            }
            .title {
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="stars" id="stars"></div>
    <h1 class="title">
        <span>王</span>
        <span>浩</span>
        <span>宇</span>
        <span>帅</span>
    </h1>

    <script>
        // 生成随机星星
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (2 + Math.random() * 3) + 's';
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
