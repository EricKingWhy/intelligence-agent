# Dependabot（GitHub 自动依赖更新）
#
# 说明/限制（本仓用 uv + pnpm 锁文件）：
#  - Python 用 **uv 生态**（2026-10-07 起，原为 pip）：pip 生态只改 pyproject.toml、
#    不认 uv.lock，它开的 PR 必然在 CI 的 `uv sync --locked` 上红（锁文件过期）。
#    uv 生态会把 pyproject.toml 与 uv.lock 一起更新，`--locked` 照常把关。
#  - npm 生态认 pnpm-lock.yaml（web/），正常闭环。
#  - github-actions 生态负责把工作流里的 SHA pin 更新到新版本（2026-10-01 起
#    全部 action 改为完整 SHA + 标签注释的形式，Dependabot 可识别并升级）。

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
