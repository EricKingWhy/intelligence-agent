# .github/workflows/coverage-ratchet.yml —— 变更可执行行覆盖率棘轮（Issue #1499）
#
# 为什么存在
#
# 本仓的行覆盖率此前**只打印、不判定**（gate1 / gate-nightly 的 `--cov-report=term/xml` 命令逐字
# 未改，本工作流也不改它）。Issue #1499 的已裁结论 11（A 案）不设全局硬门限，只做**基线留痕**
# （gate1 / gate-nightly 各追加一步，只记录不判定）与**变更行棘轮**（本工作流）。
# 判定口径的正文**只在** `scripts/check_line_coverage_ratchet.py` 的模块 docstring 写全
# （唯一事实源）；本文件与 `docs/agents/1499-coverage-ratchet.md` 都只留指针，不复述。
#
# 为什么不在 gate0 里
#
# gate0 是**推送前 ≤60s 的机械车道**、且是 main 的**必需状态检查**。棘轮要一份真覆盖率报告 ⇒
# 必须跑全量 pytest（分钟级）⇒ 它是重车道，不是机械车道。gate0 的 7 条车道一条都不改。
#
# 为什么**不是**必需状态检查（与 e2e-smoke 同一条教训，见该文件头部）
#
# 本工作流用 `paths` **白名单**（不是 `e2e-smoke.yml` 那种 `paths-ignore`），只在 `src/**` 或棘轮
# 自身变动时跑。把被 paths 过滤掉的检查挂成必需检查 ⇒ 不碰 src 的 PR 会永久停在
# "Expected — waiting for status to be reported"、且重跑绕不开。
# 所以它和 `e2e-smoke` 一样是**非必需**检查；要把它变成硬门，得先改分支保护（另需用户授权，
# 不在本票范围内）。⚠ 这不等于"可以不看":PR 上它红 = 本次改动引入的可执行行覆盖不足。
#
# 等待代价（票面 AC3 要求留证）：本作业 = `uv sync` + 全量 pytest + 覆盖率，与 gate1 的 backend
# 作业同形同命令；单人 PR 每碰一次 `src/**` 就多等这一轮。实测分钟数与机器负载记在库内
# `docs/agents/verification.md` §2 ⑯（唯一落点；引用时连同来源与负载一起给，别只抄数字）。
#
# 白名单（盲区）与纯移动跳过的口径见脚本 docstring；白名单条目本身的理由/平台写在
# `docs/agents/coverage-ratchet.whitelist.json`。纯移动的 CI 入口 = PR 标签
# `coverage-ratchet:move-only`（下方 env 注入）。两者都不接受"整域排除"。

name: coverage-ratchet

on:
  pull_request:
    branches: [main]
    # `labeled` / `unlabeled`：CI 侧的纯移动豁免靠 `coverage-ratchet:move-only` 标签开关
    # （见下方 env），默认的 opened/synchronize/reopened 不会在打标签时重跑。
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # 棘轮的分母是 `src/**` 的新增可执行行；`tests/**` 本身的改动分母恒为空，但**必须触发** ——
    # 给出的是**可见性**（这种 PR 会真的跑一轮、报告真的生成），不是阻断：其结论必然是
    # `RATCHET EMPTY`。"悄悄删测试"的**守卫**不在本票范围（需另一条"测试数量/断言行数只增不减"
    # 的棘轮），见 `docs/agents/1499-coverage-ratchet.md` §6 第 6 条。
    # `docs/**` 仍然不触发（纯文档改动确实无从守起）。
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/check_line_coverage_ratchet.py'
      - 'docs/agents/coverage-ratchet.whitelist.json'
      - '.github/workflows/coverage-ratchet.yml'

# 只读仓库 + 上传 artifact。棘轮不改任何东西。
permissions:
  contents: read
  actions: write

concurrency:
  # 与 `e2e-smoke.yml` 同源：用 PR 编号而非分支名 —— fork PR 的分支名可以重名，会互相取消。
  group: coverage-ratchet-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ratchet:
    # 作业名不要写成 "changed-lines >= 60%"：`RATCHET EMPTY` 时那枚勾也一样绿，
    # 名字会把"没有变更的可执行行"读成"达标"。判定结论看日志里的 RATCHET 行。
    name: coverage-ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出（PR 头提交；全量历史用于 merge-base 与 diff）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（Dependabot 维护 SHA pin）
        with:
          # 与 gate0.yml 同理：默认检出的是合成的 merge 提交，棘轮要算的是 PR 自己那棵树。
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 取 base 分支（`--base origin/<base>` 要算 merge-base）
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: 装 Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: 装 uv 0.10.9（缓存 ~/.cache/uv）
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.9'
          cache-dependency-glob: uv.lock
      - name: 装后端依赖
        run: uv sync --locked --all-extras
      # 与 gate1 同一条镜像：workspace 隔离用例刻意"Engine 不可用即真失败、不静默跳过"。
      - name: 准备 workspace 隔离测试所需的 Docker 镜像
        run: docker pull python:3-slim
      - name: 全量后端测试 + 覆盖率（与 gate1 逐字同命令）
        # `continue-on-error` **只在顺序层面**：先让棘轮读到报告、把判定与 artifact 落下来，
        # 再由末尾那一步把这次测试的结果**如实变成作业结论**。
        # 为什么不能就这么留在绿：`gate1` 只跑 `push: main` / 手动触发，**PR 侧没有第二个作业**
        # 会跑全量 pytest —— 若这里把红吞掉，"PR 上全量测试红"就无人看见（棘轮本身不会假绿，
        # 但整条 check 会报 ✔，而那是我方唯一会读到的信号）。
        id: pytest
        continue-on-error: true
        run: |
          mkdir -p artifacts
          uv run pytest tests \
            --junitxml=artifacts/pytest.xml \
            --cov=src/agent_harness \
            --cov-report=term \
            --cov-report=xml:artifacts/coverage.xml
      - name: 基线留痕（这份报告是哪棵树、哪个平台、什么范围测出来的）
        run: |
          uv run python scripts/check_line_coverage_ratchet.py baseline \
            --report artifacts/coverage.xml \
            --out artifacts/coverage-baseline.json \
            --scope "pytest tests + --cov=src/agent_harness（ubuntu-latest / py3.13）"
      - name: 变更行棘轮（< 60% 退出 1；无变更可执行行 ⇒ 显式 RATCHET EMPTY）
        env:
          # 唯一的 CI 侧纯移动声明入口（AC3 第三条）：给 PR 打 `coverage-ratchet:move-only` 即
          # 声明"本 PR 是纯移动/重命名"。**只有说明不够** —— 脚本仍要求 git `-M` 判出 `R100`，
          # 移动 + 修改（`R<100`）照常计入分母，贴标签骗不过去。
          COVERAGE_RATCHET_MOVE_ONLY_NOTE: ${{ contains(github.event.pull_request.labels.*.name, 'coverage-ratchet:move-only') && format('PR #{0} 显式声明纯移动（coverage-ratchet:move-only 标签）', github.event.pull_request.number) || '' }}
        run: |
          uv run python scripts/check_line_coverage_ratchet.py ratchet \
            --report artifacts/coverage.xml \
            --baseline artifacts/coverage-baseline.json \
            --base origin/${{ github.base_ref }}
      - name: 测试结果就是作业结论（红不被棘轮的绿盖住）
        if: steps.pytest.outcome == 'failure'
        run: |
          echo "❌ 全量 pytest 红（见 artifacts/pytest.xml）。棘轮读数仍已上传，但本作业判失败。"
          echo "   PR 侧只有这个作业会跑全量 pytest（gate1 仅 push:main / 手动触发）⇒ 红必须在这里可见。"
          exit 1

      - name: 上传报告（失败也传）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-ratchet-reports
          path: artifacts/
          retention-days: 30
