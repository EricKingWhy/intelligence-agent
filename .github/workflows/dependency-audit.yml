name: dependency audit

on:
  pull_request:
  push:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.9'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10.32.1'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Scan locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          {
            date -u +%FT%TZ
            git rev-parse HEAD
            sha256sum uv.lock web/pnpm-lock.yaml desktop/installer/python-runtime.lock.json
            python --version
            uv --version
            pnpm --version
            uv tool run pip-audit==2.10.1 --version
          } > audit-results/metadata.txt
          uv export --locked --no-dev --no-hashes --no-emit-project -o audit-results/python-production.txt > /dev/null
          uv export --locked --all-extras --no-hashes --no-emit-project -o audit-results/python-development.txt > /dev/null
          # Marker-free superset covers packages skipped by the runner's platform/interpreter.
          python -c 'import tomllib; from pathlib import Path; p=tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))["package"]; assert all("registry" in x["source"] or x["source"] == {"editable": "."} for x in p), "non-registry package needs audit support"; q=[x for x in p if "registry" in x["source"]]; assert len({x["name"] for x in q}) == len(q), "multiple versions need audit support"; Path("audit-results/python-lock-superset.txt").write_text("".join("{}=={}\n".format(x["name"], x["version"]) for x in q), encoding="utf-8")'
          python -c 'import json; from pathlib import Path; p=json.loads(Path("desktop/installer/python-runtime.lock.json").read_text(encoding="utf-8")); Path("audit-results/installer.txt").write_text("".join("{}=={}\n".format(w["name"], w["version"]) for w in p["wheels"]), encoding="utf-8")'
          printf 'urllib3==1.26.5\n' > audit-results/negative-control.txt
          for name in python-production python-development python-lock-superset installer negative-control; do
            set +e
            uv tool run pip-audit==2.10.1 --disable-pip --no-deps -r "audit-results/$name.txt" --format json -o "audit-results/$name.json"
            status=$?
            set -e
            if [[ "$name" == negative-control ]]; then
              python -c 'import json,sys; p=json.load(open(sys.argv[2], encoding="utf-8")); assert sys.argv[1] == "1" and any(d["vulns"] for d in p["dependencies"]), "negative control failed"' "$status" "audit-results/$name.json"
            else
              python scripts/check_dependency_audit.py pip-audit "$status" "audit-results/$name.json"
            fi
          done
          set +e
          pnpm --dir web audit --json > audit-results/web.json
          status=$?
          set -e
          python scripts/check_dependency_audit.py pnpm "$status" audit-results/web.json
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ github.sha }}
          path: audit-results/
          retention-days: 30
