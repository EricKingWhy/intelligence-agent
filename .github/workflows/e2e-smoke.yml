# .github/workflows/e2e-smoke.yml —— e2e 冒烟集（PR 级）独立工作流（issue #1338 改动 1）
#
# 为什么拆出来（这是本文件存在的唯一理由）
#
# 冒烟集只在 `web/**` 变动时有意义：纯 `docs/**` 的 PR 跑 413s（约 7min，#1330 实测）
# 的 Chromium 是纯浪费。
# 但**不能**把 `paths-ignore: ['docs/**']` 加到 gate0.yml 上：gate0 是分支保护里的**必需**
# 状态检查（strict: true），被 paths-ignore 跳过的必需检查在 GitHub 上**永远不会被报出**，
# 于是 docs-only PR 会永久停在 "Expected — waiting for status to be reported"，卡死所有
# 纯文档 PR，且重跑也绕不开（#1338 两轮审查已坐实）。所以拆成两个工作流：paths-ignore
# 只落在**非必需**的这一个上。
#
# ⚠ 永远不要把本文件的 `paths-ignore` 抄进 gate0.yml。加任何 paths-ignore 之前，先确认
#   被忽略的路径不是某个门禁的**活输入**：docs/agents/verification.map.tsv、
#   docs/EVENT_VOCABULARY.md、docs/review_ledger*（gate0 的覆盖闸门与词表守卫读它们），
#   以及 docs/plans/ask-user/ask.html（vitest 直接读它）。这些路径一旦被忽略，门禁就会在
#   真正需要它的时候被静默跳过。本工作流忽略 docs/** 是安全的：它自己不读任何 docs 输入。
#
# 成熟产品的同类做法：Django 的 CI 用 paths-ignore 跳过 docs/**；VS Code 用 detect-changes
# 决定要不要跑重车道 —— 都是按路径裁剪**可选**车道，而不是裁剪**必需**检查。

name: e2e-smoke

on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**']

# 本工作流只读仓库，不需要任何写权限。
permissions:
  contents: read

concurrency:
  # 同一个 PR 连推多次时只保留最后一次。
  group: e2e-smoke-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: e2e 冒烟集（Chromium，PR 级）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出 PR 头提交
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: 装 pnpm 10.32.1
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - name: 装 Node 22（pnpm store 缓存）
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 装前端依赖
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: 缓存 playwright 浏览器
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: 装 Chromium（--with-deps 由 runner root 装系统库）
        working-directory: web
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: 运行 e2e 冒烟集（2 worker；webServer 自动起 vite :5173）
        working-directory: web
        run: node node_modules/@playwright/test/cli.js test --workers=2 task-review.spec.ts u-project-task.spec.ts control-row.spec.ts context-usage.spec.ts y-inspector-peek.spec.ts w-session-delete.spec.ts e-reconnect.spec.ts d-recover.spec.ts stream-fallback.spec.ts n-approval-card.spec.ts composer-stream-actions.spec.ts queue-flush.spec.ts multiturn-queue.spec.ts keep-text-on-reject.spec.ts
