# .github/workflows/e2e-smoke.yml —— e2e 冒烟集（PR 级）独立工作流（issue #1338 改动 1）
#
# 为什么拆出来（这是本文件存在的唯一理由）
#
# 冒烟集只在 `web/**` 变动时有意义：纯 `docs/**` 的 PR 跑 413s（约 7min，#1330 实测）
# 的 Chromium 是纯浪费。
# 但**不能**把 `paths-ignore: ['docs/**']` 加到 gate0.yml 上：gate0 是分支保护里的**必需**
# 状态检查（strict: true），被 paths-ignore 跳过的必需检查在 GitHub 上**永远不会被报出**，
# 于是 docs-only PR 会永久停在 "Expected — waiting for status to be reported"，卡死所有
# 纯文档 PR，且重跑也绕不开（#1338 两轮审查已坐实）。所以拆成两个工作流：paths-ignore
# 只落在**非必需**的这一个上。
#
# ⚠ 永远不要把本文件的 `paths-ignore` 抄进 gate0.yml。加任何 paths-ignore 之前，先确认
#   被忽略的路径不是某个门禁的**活输入**：docs/agents/verification.map.tsv、
#   docs/EVENT_VOCABULARY.md、docs/review_ledger*（gate0 的覆盖闸门与词表守卫读它们），
#   以及 docs/plans/ask-user/ask.html（vitest 直接读它）。这些路径一旦被忽略，门禁就会在
#   真正需要它的时候被静默跳过。本工作流忽略 docs/** 是安全的：它自己不读任何 docs 输入。
#
# 成熟产品的同类做法：Django 的 CI 用 paths-ignore 跳过 docs/**；VS Code 用 detect-changes
# 决定要不要跑重车道 —— 都是按路径裁剪**可选**车道，而不是裁剪**必需**检查。
#
# #1500：跑哪些 spec 不再写死。`docs/agents/e2e_scope_map.tsv` 是「路径 → spec」的唯一
# 事实源，`scripts/e2e_scope.py` 把本 PR 的改动面翻译成
#   **常驻 14 ∪ 映射命中（去重）**。
# 三条读法（本 job 的日志逐段打印出来，便于复核）：
#   ① 改动文件清单；② 每行命中 `matched <path> -> <specs>`；③ `selected after dedup` + `SPECS:`。
# 行为口径：
#   - 常驻 14 永不消失（表里 `ALWAYS` 行）——相关性算法只做加法。
#   - 冷区改动选中它那一行的 spec；全局面（外壳/配置/夹具）选中表内全部。
#   - **`web/src/**` 下未映射的产品文件**（非测试）⇒ `e2e_scope.py` 退出 2 ⇒ 本 job 红
#     （漏配时报出来，而不是静默少跑）。回滚方式：把映射表那一行补上。
#     其余未映射 `web/**`（`*.test.ts(x)` / `web/*.md` / `public/` / `e2e-live/` /
#     `web/scripts/perf-*.mjs` 等）只打 warning、跑常驻 14、退出 0 —— 实测
#     `git ls-files web/` 498 个跟踪文件里 241 个属这一类（另有 102 个有映射行、155 个是
#     未映射产品面），若一律变红，改一支 vitest 用例就会红，routine 的红会把真漏选淹掉
#     （复审第 1 轮 P2-1 的裁决）。
#   - 有未映射产品面时**不打印 `SPECS:` 行**（「无 SPECS 行」本身即失败信号）。
#   - 本工作流**仍是非必需检查**：可见、不卡合并（理由见上：paths 过滤 + 必需检查 =
#     永久 pending）。改分支保护需要单独授权，不在本票范围。

name: e2e-smoke

on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**']

# 本工作流只读仓库，不需要任何写权限。
permissions:
  contents: read

concurrency:
  # 同一个 PR 连推多次时只保留最后一次。
  group: e2e-smoke-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: e2e 冒烟集（Chromium，PR 级）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出 PR 头提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # #1500：选测要算 `base...head` 的改动面 ⇒ 必须拿到 base 提交。
          # 全图克隆与 gate0.yml 同款（该仓已在必需检查里付过这份代价）。
          fetch-depth: 0
      - name: 装 pnpm 10.32.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.32.1
      - name: 装 Node 22（pnpm store 缓存）
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 装前端依赖
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: 缓存 playwright 浏览器
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: 装 Chromium（--with-deps 由 runner root 装系统库）
        working-directory: web
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: 算本次要跑的 spec（常驻 14 ∪ 改动面命中，去重）
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # 三点 diff：`base...head` 从 merge-base 起算，不受 base 分支后续提交影响
          # （与 PR 的 "Files changed" 口径一致）。
          git diff --name-only --no-renames "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA" \
            > /tmp/changed.txt
          echo "── 改动文件（$(wc -l < /tmp/changed.txt) 个）──"
          cat /tmp/changed.txt
          # `web/src/**` 的非测试未映射文件 → 退出 2 → 本步（因而整个 job）变红。
          # 这是 AC3 的「热区漏配要红」；e2e-smoke 非必需，红了只提示、不卡合并。
          # 其余未映射 web/** 只打 `[warning]`（脚本 stdout），不影响退出码。
          python3 scripts/e2e_scope.py --changed-list - < /tmp/changed.txt | tee /tmp/scope.txt
          specs=$(sed -n 's/^SPECS: //p' /tmp/scope.txt)
          # 空集合会让 playwright 跑**全量**（等于把 PR 车道变成夜间车道）⇒ 显式变红。
          # 有未映射产品面时脚本刻意不打印 `SPECS:` ⇒ 也落到这一支（「无 SPECS 行」即失败信号）。
          test -n "$specs" || { echo "::error::选测集为空，拒绝退化成全量"; exit 1; }
          echo "── 选测（去重后 $(wc -w <<<"$specs") 支）──"
          tr ' ' '\n' <<<"$specs"
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
      - name: 运行 e2e（选测集；2 worker；webServer 自动起 vite :5173）
        working-directory: web
        run: node node_modules/@playwright/test/cli.js test --workers=2 ${{ steps.scope.outputs.specs }}