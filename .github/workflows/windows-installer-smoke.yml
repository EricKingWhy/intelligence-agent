# .github/workflows/windows-installer-smoke.yml —— W-16 Windows x64 安装器真机烟测（Issue #885）
#
# 为什么存在
#
# `desktop/scripts/test-windows-installer.mjs`（#361 [W-16] 的验收烟测）首行硬性要求
# `process.platform === 'win32' && process.arch === 'x64'`（脚本本身如此，本工作流**不改**它的
# 行为与判据）。Linux 本机与云端 Docker 沙箱都跑不了 ⇒ #831 的 AC1（两语言 install/uninstall
# UI 烟测）只能标 NOT_RUN。仓库是 public，GitHub 托管的 `windows-latest` runner 免费，且预装
# Node + PowerShell + bsdtar，正好满足脚本需求：脚本实际跑的是 `$Installer /S` 静默安装，
# 无头 runner 可跑，**不需要**交互桌面。
#
# 它跑什么
#
# 脚本用生产的 NSIS 配置（`installer/installer.nsh` + `installer-directories.nsh`）为每次运行
# 构一个随机 GUID 的隔离安装包，在 en_US + zh_CN 两种语言下跑真实安装/卸载断言：
#   - 默认模式      → `windows-installer-smoke.ps1`：静默安装、校验卸载注册表项、安装目录与
#                     用户数据标记（%APPDATA%\intelligence-agent）未被安装触碰；
#   - `--uninstall-only` → `windows-uninstall-smoke.ps1`：安装后静默卸载，断言「程序被移除、
#                     注册表项被移除、用户数据**必须**保留」（#361 的核心保证）。
# 本工作流跑全套（默认 + `--uninstall-only`）；`--compile-only` 是手动触发的快速模式（只编译
# 安装包，跳过 UI 断言）。
#
# 依赖说明：脚本给 electron-builder 传 `prepackaged`（一个最小原生 payload），而 app-builder-lib
# 的 `platformPackager.doPack` 在 `prepackaged != null` 时**直接返回** ⇒ `afterPack` 钩子与
# `extraResources` 都不会执行 ⇒ **不需要**按 `installer/README.md` 准备 `installer/staging` 里的
# 离线 Python 运行时。脚本只 `require('electron-builder')` + `app-builder-lib/out/toolsets/windows.js`
# （lazy-require，故意不进 `desktop/package.json`，见 build-windows-installer.mjs 头注释），
# 所以本工作流在 `npm ci` 之后按版本显式装它。
#
# 真机腿（#1074）
#
# 本工作流除两条 UI 断言外，还跑 `test/harness/r1-drivers/run-stage-damaged-probe.ps1`：它把
# **生产的** `iaStageApplication` 宏原文注入一个临时 NSIS 脚本，在「有/无安装树、有/无进程」
# 的几种组合上真编译、真运行，读退出码与结果文件。
#
# 为什么必须在 CI 里跑（#1074 残余 ②）：构建期规则 `validateProcessGateGuards()` 只读**文本**，
# 它能钉住「调用出现在哪里」，钉不住「被调用的函数还在不在分类」。两轴审查各自独立写出的同一条
# 变异——在 `iaRequireNoRunningProduct` 体内加 `StrCmp $iaProbeFound "0" 0 +2` / `Return`
# （= 被调用，但缺 exe 时立刻返回）——**活过全部构建期用例**（实测全绿，读数见 #1074 证据 §1.2），只有这条真机腿转红。
# 同理，把分类器里「12（还有别的东西在跑）」弱化成 11 的变异也活过全部构建期用例，靠 `damaged-mixed`
# 腿（运行时 + 客户端同时在跑 ⇒ 必须拒绝且**一个都不杀**）才看得见 —— 单进程腿两种答案的退出码相同，
# 分辨不出来。在把这条腿接进来之前，判别器只存在于人工、依赖本机 NSIS 缓存的脚本里，没有任何 CI
# 会跑到它。
#
# 依赖：探针需要 electron-builder 缓存的 makensis（`%LOCALAPPDATA%\electron-builder\Cache\
# nsis-3.0.4.1`，探针递归查找）与 PATH 上的 node —— 两者都由**上面已经跑过的烟测步骤**建立
# （烟测真的用 electron-builder 构安装包）。所以这一步必须排在那两步**之后**。
#
# 边界：本工作流**不是** main 的必需状态检查（#885 明写），这条腿同样不是——它只在安装器相关
# 文件变化时跑。覆盖边界如实写在这里，不假装它是一条全量守卫。
#
# checkout 的坑位（照 gate0.yml 的三个教训）
#
# ① `ref: github.event.pull_request.head.sha` —— `actions/checkout` 默认检出 `refs/pull/N/merge`
#    这个**合成 merge 提交**；本工作流要测的是 PR 的**头提交**本身。`workflow_dispatch` 没有
#    pull_request 事件，回退到 `github.ref`（手动选的分支）。
# ② `fetch-depth: 0` —— 与 gate0 的 checkout 形态保持一致，不给自己留「以后加覆盖闸门车道就踩
#    浅克隆坑」的伏笔（本工作流当前不跑覆盖闸门，全历史不是必需的）。
# ③ 只跑 `pull_request`（+ 手动），**不跑 push** —— 与 gate0 同理：PR 合并后 main 顶端会多出
#    一个新提交，若在 push 上跑，main 会在每次集成后被动变红。本工作流**不设为** main 必需状态
#    检查（Issue #885「不做」明写）。
#
# 加固
#
# `permissions`：仓库内容只读（`contents: read`）+ `actions: write`（artifact 上传需要）。
# 所有第三方 action 一律**完整 SHA + 版本注释**（与仓库既有工作流一致；tag 可变、可删，
# 有投毒面），升级走 Dependabot。

name: windows-installer-smoke

on:
  workflow_dispatch:
    inputs:
      compile_only:
        description: '只编译 NSIS 安装包（跳过安装/卸载 UI 断言），用于快速自检'
        required: false
        type: boolean
        default: false
  pull_request:
    # 路径过滤：只在安装器相关文件变化时跑，不给每个 PR 增加 10–20 分钟负担。
    # 除票面点名的三条外，另加：两个被执行的 PowerShell 断言脚本（test-windows-installer.mjs
    # 直接 shell 它们）、build-windows-installer.mjs（烟测直接 import 它）、desktop 的依赖清单
    # （本 job 跑 `npm ci` 构建安装包）与本工作流自身。另加 `desktop/test/**`（#1074 的
    # r1-drivers 真机腿与夹具、#1166 的六套守卫套件与探针夹具都在其中）：凡是本 job 执行的
    # 测试资产，改动都要被它验证。
    paths:
      - 'desktop/installer/**'
      - 'desktop/test/**'
      - 'desktop/scripts/test-windows-installer.mjs'
      - 'desktop/scripts/windows-installer-smoke.ps1'
      - 'desktop/scripts/windows-uninstall-smoke.ps1'
      - 'desktop/scripts/build-windows-installer.mjs'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - '.github/workflows/windows-installer-smoke.yml'

# 仓库只读；artifact 上传需要 `actions: write` —— GitHub 对 token 的作用域要求，
# 缺它会 403 "Resource not accessible"（与仓库既有 gate1.yml / security.yml 同口径）。
permissions:
  contents: read
  actions: write

concurrency:
  # 同一 PR 连推多次时只保留最后一次 —— 前一次的结论对判定没有意义。
  group: windows-installer-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer-smoke:
    name: windows-installer-smoke
    runs-on: windows-latest
    # hung 时不能无限烧分钟数。
    timeout-minutes: 45
    steps:
      - name: 检出（PR 头提交；workflow_dispatch 用所选分支）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: 装 Node 22（desktop/package.json engines 要求 node >= 22）
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 装 desktop 依赖（npm ci，锁文件钉住）
        working-directory: desktop
        run: npm ci

      # #1166：六套守卫套件此前在 CI 里没有任何入口——改 desktop/test/** 不触发任何
      # workflow，gate0 与 pre-push 也没有 `node --test`，它们只在本机跑过。六套纯 node、
      # 共约 3 秒（本机四次实测 2882 / 2657 / 2595 ms；另一次在并行任务下 7673 ms）、不编译安装包、连 electron-builder 都不需要
      # （本机在**没有 desktop/node_modules** 的检出上跑通），所以排在装 electron-builder
      # 与三条烟测腿之前：最便宜的信号先失败。两个用例按 existsSync 跳过——它们要的
      # desktop/dist 与 installer/staging 是 `npm run build` / `prepare_python_runtime.py`
      # 的产物，本 workflow 都不产出（烟测腿给 electron-builder 传 prepackaged，
      # app-builder-lib 的 doPack 在 prepackaged != null 时直接返回，afterPack 与
      # extraResources 都不执行），所以这两个用例在 CI 里仍然是跳过，不是真跑。
      - name: 守卫套件 — 安装器脚本 / node 运行时 / NSIS 结构 / 运行时产品 / TUI / Web 资产（#1166）
        if: ${{ !inputs.compile_only }}
        working-directory: desktop
        shell: pwsh
        # 六个名字必须与磁盘一致：`node --test` 只要拿到**至少一个**有效路径，对不存在的路径就
        # 静默跳过、exit 0（2026-10-15 实测；六个全不存在才 exit 1）⇒ 一次改名或笔误会让整套
        # 静默消失，CI 照样绿。所以先逐个 Test-Path，缺一个就红，不让绿掩盖「套件没跑」。
        run: |
          $suites = @(
            'test/installer-scripts.test.mjs'
            'test/installer-node-runtime.test.mjs'
            'test/installer-nsis.test.mjs'
            'test/installer-runtime-product.test.mjs'
            'test/installer-tui.test.mjs'
            'test/installer-web-assets.test.mjs'
          )
          $missing = $suites | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) { throw "missing test file(s): $($missing -join ', ')" }
          node --test @suites

      - name: 装 electron-builder（脚本 lazy-require，未进 desktop/package.json）
        working-directory: desktop
        # electron-builder 不在 desktop 依赖里（脚本 lazy-require；见 build-windows-installer.mjs
        # 头注释「npm i -D electron-builder」，故锁文件无它）⇒ 此处是版本唯一钉点，锁死 26.15.3。
        run: npm install --no-save --no-audit --no-fund electron-builder@26.15.3

      - name: 安装器烟测 — 安装断言（en_US + zh_CN）
        if: ${{ !inputs.compile_only }}
        working-directory: desktop
        run: node scripts/test-windows-installer.mjs

      - name: 安装器烟测 — 卸载断言 + 用户数据保留（en_US + zh_CN）
        if: ${{ !inputs.compile_only }}
        working-directory: desktop
        run: node scripts/test-windows-installer.mjs --uninstall-only

      # #1165：在隔离 scratch 注册表键与临时安装目录里，用**修复前**的生产宏先
      # 复现两个原始拒绝症状，再由下方真机腿验证修复后的拒绝行为。基线源码只
      # 写入 RUNNER_TEMP；NSIS 缓存由上面的安装器烟测建立。
      #
      # #1261：基线锚定在 #1165 修复落地的**上一个 main 提交** `5497abdd`
      # （`git show 5497abdd:…`；fetch-depth: 0 已具备全历史）。原先读
      # `github.event.pull_request.base.sha` 的前提是「base 早于修复」——#1254
      # 合入后新 PR 的 base 本身已含修复，「pre-fix 症状」结构性不可复现，步骤
      # 在 main 侧持续红（dependabot 两笔在先）。锚 SHA 意味着：该步骤测的是
      # 「今天的生产源码 + 历史修复前源码」的对称红证；若 #1165 的修复被回退，
      # 下方修复后真机腿会红，红证腿不会（它测的是历史事实，不是当前状态）。
      - name: '真机红证 — #1165 原始拒绝症状'
        if: ${{ github.event_name == 'pull_request' && !inputs.compile_only }}
        working-directory: desktop
        shell: pwsh
        env:
          PRE_1165_BASE_SHA: '5497abddeb168c7b4472a27a97aa45dd737836b5'
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'installer-directories-pre-1165.nsh'
          $source = & git show "${env:PRE_1165_BASE_SHA}:desktop/installer/installer-directories.nsh"
          if ($LASTEXITCODE -ne 0) { throw "could not read the pre-#1165 installer source from $env:PRE_1165_BASE_SHA" }
          [System.IO.File]::WriteAllText($baseline, ($source -join "`n") + "`n", [System.Text.Encoding]::UTF8)
          powershell -NoProfile -ExecutionPolicy Bypass -File test/harness/r1-drivers/run-stage-damaged-probe.ps1 -DirectoriesSource $baseline -Expect1165Regression

      - name: 快速模式 — 仅编译安装包
        if: ${{ inputs.compile_only }}
        working-directory: desktop
        run: node scripts/test-windows-installer.mjs --compile-only

      # #1166：守卫规则自身的牙齿检查——按规则逐条原地变异 build-windows-installer.mjs 并各自
      # execFile 两套套件，本机实测 250 s（复核 235 s；比真机腿的 81 s 更贵，但不需要 makensis）。排在守卫
      # 套件之后：套件全绿只有在守卫本身有牙齿时才成立；排在真机腿之前：规则坏掉时先别花掉 8 次编译。
      - name: 牙齿检查 — 守卫规则自身（#1166）
        if: ${{ !inputs.compile_only }}
        working-directory: desktop
        run: node test/harness/teeth-check-guards.mjs

      # #1074：构建期规则钉的是「调用位置」，钉不住「闸门是否真的分类」——在
      # iaRequireNoRunningProduct 体内加一个提前返回（`StrCmp $iaProbeFound "0" 0 +2` /
      # `Return`）活过全部构建期用例，只有这条真机腿转红。它必须排在烟测之后：
      # 探针要 electron-builder 缓存里的 makensis，而那份缓存正是上面两步建立的。
      - name: 真机腿 — 进程闸门对损坏安装与首次安装的分类（#1074）
        if: ${{ !inputs.compile_only }}
        working-directory: desktop
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test/harness/r1-drivers/run-stage-damaged-probe.ps1

      - name: 上传安装器测试产物与日志（失败也上传）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-smoke
          path: desktop/.desktop-build/installer-tests/**
          if-no-files-found: warn
          retention-days: 14
