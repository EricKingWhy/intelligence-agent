[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[project]
name = "intelligence-agent"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi>=0.141.1",
    # #530 IMP-17：delegate output_schema 用原生 JSON Schema dict 做应用侧校验
    # （Draft 2020-12，MIT）；pydantic 只能对 Python 类型校验，做不到这件事。
    "jsonschema>=4.23.0",
    # #203 / ADR-0032：自定义供应商密钥进凭据管理器（Windows 后端即 WinVault）。
    "keyring>=24",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.5.0",
    "mcp>=2.1.1",
    # #823 MM-02：图片归一化（EXIF 方向、alpha→WebP 否则 JPEG、限内缩放）需要
    # 真实解码/重编码，标准库做不到。归一化语义移植自 DeepSeek Harness
    # `attachment-local/src/normalization.ts`（MIT，commit 5badb150，上游用 sharp），
    # 本仓改用 Pillow。MM-01（#822）的 probe.py 注释已登记「本仓未依赖 Pillow，
    # 归一化是 MM-02」，故本票引入。
    "pillow>=10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1.2.2",
    "sse-starlette>=2.1.0",
    "tiktoken>=0.7.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agent-harness = "agent_harness.cli:main"

[project.optional-dependencies]
artifact = ["aioboto3>=13.0"]
memory = [
    "langgraph>=0.6.0",
    "langmem>=0.0.30,<0.1",
    "pymilvus>=3.0.2,<3.1",
]
observability = [
    "langfuse>=3",
]
sandbox = [
    "docker>=7",
]

[tool.uv.build-backend]
module-name = "agent_harness"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    # demo/live_agent.py 用它做彩色终端渲染；不是运行时依赖。
    "rich>=13.7.0",
    "wsproto>=1.3.2",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
# 让项目根进入 sys.path，使 tests/ 下的测试辅助模块（如 scripted_model）
# 能以 tests.xxx 形式被跨文件导入；否则只有 src 在路径上。
pythonpath = ["."]
# 仓库根无参数 pytest 的收集面 = tests/。不设这条时收集面是整个 rootdir，会走进根下两棵
# gitignored 的打包产物树（desktop/dist-installer、desktop/installer/staging，各含一份
# Python 运行时）：其中 pywin32 的 test_addtask.py 在收集期就把解释器打成访问违例、
# 零用例执行，输出里没有任何失败签名（#856）。
testpaths = ["tests"]
# 集成测试默认不跑（烧 token、依赖真实 LLM）。
# 手动跑：uv run pytest -m integration
# testpaths 只兜住「不给路径」的调用；显式 `pytest .` 仍从 rootdir 走，所以按路径追加
# 忽略那两棵产物树（不用 norecursedirs：它会替换掉 pytest 的默认忽略表，
# .* / build / dist / node_modules / venv 都得自己抄回来）。
addopts = [
    "-m", "not integration and not qiniu",
    "--ignore=desktop/dist-installer",
    "--ignore=desktop/installer/staging",
]
markers = [
    "integration: 端到端集成测试（需要真实 LLM API key、烧 token）",
    "live_services: integration test that intentionally reads credentials for real services",
    "qiniu: 七牛云 S3 集成测试（需要真实对象存储凭证）",
]
